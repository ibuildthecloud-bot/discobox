# discobox-wire.service on a machine sandbox (ADR 26-11-02-023 §2), which its
# pool places as a drop-in and a container's never does. A machine has no
# config volume: it is wired where its pool placed the bootstrap, and on every
# boot, since its mounts do not survive a restart either. Its wiring failing
# powers it off, which the pool reports as a stopped sandbox, the way it
# reports an exited container: a machine has no manager to exit.
[Unit]
ConditionPathExists=
ConditionPathExists=/etc/discobox/sandbox.json
FailureAction=poweroff-force
